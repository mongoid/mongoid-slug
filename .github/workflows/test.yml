name: CI RSpec Test

on: [push, pull_request]

jobs:
  rubocop:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v3
      - name: Set up Ruby 3.4
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          bundler-cache: true
      - name: Run RuboCop
        run: bundle exec rubocop --parallel

  build:
    name: >-
      "${{ matrix.ruby }} mongoid-${{ matrix.mongoid }}"
    env:
      CI: true
      TESTOPTS: -v
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - ruby-2.7
          - ruby-3.0
          - ruby-3.1
          - ruby-3.2
          - ruby-3.3
          - ruby-3.4
          - truffleruby
        mongoid:
          - 7.0
          - 8.0
          - 8.1
          - 9.0
        experimental: [false]
        include:
          - ruby: ruby-3.2
            mongoid: head
            experimental: true
          - ruby: ruby-head
            mongoid: 7
            experimental: true
          - ruby: ruby-head
            mongoid: head
            experimental: true
          - ruby: jruby
            mongoid: 8
            experimental: true
          - ruby: jruby-head
            mongoid: 8
            experimental: true
          - ruby: truffleruby-head
            mongoid: 7
            experimental: true

    steps:
      - name: repo checkout
        uses: actions/checkout@v2

      - name: start mongodb
        uses: supercharge/mongodb-github-action@1.6.0
        with:
          mongodb-version: 4.4
          mongodb-replica-set: rs0

      - name: load ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: 2

      - name: bundle install
        run:  bundle install --jobs 4 --retry 3
        env:
          MONGOID_VERSION: ${{ matrix.mongoid }}

      - name: test
        timeout-minutes: 10
        run: bundle exec rake spec
        continue-on-error: ${{ matrix.experimental }}
        env:
          MONGOID_VERSION: ${{ matrix.mongoid }}
